    if (d.indexOf('880') === 0) d = d.slice(2);

  function etaRange(min, max) {

      var url = URL.createObjectURL(file), im = new Image();
      im.onload = function () {
        var s = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
        var w = Math.max(1, Math.round(im.naturalWidth * s)), h = Math.max(1, Math.round(im.naturalHeight * s));
        var c = document.createElement('canvas'); c.width = w; c.height = h;
        var x = c.getContext('2d'); x.fillStyle = '#ffffff'; x.fillRect(0, 0, w, h); x.drawImage(im, 0, 0, w, h);
        URL.revokeObjectURL(url);
        c.toBlob(function (b) { b ? res(b) : rej(new Error('blob')); }, 'image/jpeg', q);
      };
      im.onerror = function () { URL.revokeObjectURL(url); rej(new Error('img')); };
      im.src = url;

    state.lbusy = true; state.lmsg = ''; render();
    var ok = false;
    try { ok = (await pwDerive(pass)) === PW_HASH; } catch (e) { state.lmsg = 'এই ব্রাউজারে লগইন চালানো যাচ্ছে না। অন্য ব্রাউজারে চেষ্টা করুন।'; }
    if (!ok && !state.lmsg) { pwFails++; await new Promise(function (r) { setTimeout(r, Math.min(pwFails, 5) * 800); }); state.lmsg = 'পাসওয়ার্ড ভুল।'; }
    state.lbusy = false;
    if (ok) {
      pwFails = 0;
      try { localStorage.setItem('admin-ok', JSON.stringify({ t: Date.now(), h: PW_HASH.slice(0, 16) })); } catch (e) {}
      state.owner = true; state.canImg = true; openAdmin();
    } else if (state.view === 'login') render();
  }
  /* Leave the admin screens and go back to what customers see. */
  function leaveAdmin() {
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    state.owner = false; state.canImg = false; state.lmsg = ''; state.view = 'menu'; window.scrollTo(0, 0); render();
  }
  function doLogout() { try { localStorage.removeItem('admin-ok'); } catch (e) {} leaveAdmin(); }
  app.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target && e.target.id === 'l-pass') doLogin(); });

  function checkOwner() {
    if (location.hash === '#admin') {
      if (isAuthed()) { if (!state.owner) { state.owner = true; state.canImg = true; if (state.view === 'menu') render(); } }
      else if (state.view === 'menu' || state.view === 'login') { state.owner = false; state.canImg = false; state.view = 'login'; render(); }
    } else if (state.owner || state.view === 'login') {
      state.owner = false; state.canImg = false;
      if (state.view === 'login' || state.view === 'admin') state.view = 'menu';
      render();
    }
  }
  window.addEventListener('hashchange', checkOwner); checkOwner();
})();
</script></body></html>
